applications:
  - name: django-app
    namespace: argocd
    project: default
    repoURL: https://github.com/bonny-art/goit-devops-hw.git
    targetRevision: lesson-8-9
    path: lesson-8-9/charts/django-app
    destinationNamespace: default
    destinationServer: https://kubernetes.default.svc
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
      syncOptions:
        - CreateNamespace=true
