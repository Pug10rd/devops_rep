applications:
  - name: django-app
    namespace: default
    project: default
    source:
      repoURL: <https://github.com/Pug10rd/devops_rep.git>
      path: django-chart
      targetRevision: main
      helm:
        valueFiles:
          - values.yaml
    destination:
      server: <https://kubernetes.default.svc>
      namespace: default
    syncPolicy:
      automated:
        prune: true
        selfHeal: true

repositories:
  - name: django-app
    url: <https://github.com/Pug10rd/devops_rep.git>
    username: YOUR_USERNAME
    password: YOUR_PASS

repoConfig:
  insecure: "true"
  enableLfs: "true"
